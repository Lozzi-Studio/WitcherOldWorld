<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestProject</title>
    <link rel="stylesheet" type="text/css" href="src/frontend/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://use.typekit.net/xno6vtf.css">

</head>
<body style="margin-top: 0; margin-left: 0;">
    <script type="module" src="./src/main.js"></script>

    <div class="container container--row container--neutral borders--top-right" id="player-window">
        <div class="container container--col">
            <div class="avatar-container avatar-container--big">
                <img class="avatar avatar--big" id="player-avatar" src="">
            </div>
            <div class="textbox textbox--fill-neutral">
                <p class="textbox__text--fill-neutral textbox__text--fancy-font" id="player-name">NAME</p>
            </div>
        </div>
        <div class="container container--col inner-borders inner-borders--neutral" id ="player-stats">
            <div class="container container--row container--no-padding" id="combat-lvl">
                <div class="stat-icon-container"><img class="stat-icon" src="./resources/assets/stat-icons/combat.png"></div>
            </div>
            <div class="container container--row container--no-padding" id="defense-lvl">
                <div class="stat-icon-container"><img class="stat-icon" src="./resources/assets/stat-icons/defense.png"></div>
            </div>
            <div class="container container--row container--no-padding" id="alchemy-lvl">
                <div class="stat-icon-container"><img class="stat-icon" src="./resources/assets/stat-icons/alchemy.png"></div>
            </div>
            <div class="container container--row container--no-padding" id="special-lvl">
                <div class="stat-icon-container"><img class="stat-icon" src="./resources/assets/stat-icons/speed.png"></div>
            </div>
        </div>
    </div>

    <div class="container container--col container--neutral borders--bottom-left" id="phase-window">
        <div class="container container--row" id="avatars-container">
            <!-- <div class="avatar-container avatar-container--small avatar-container--neutral" id="avatar-container-1">
                <img  class="avatar avatar--small" id="avatar-1" src="./resources/assets/avatars/bear.webp">
            </div>
            <div class="avatar-container avatar-container--small avatar-container--neutral avatar-container" id="avatar-container-2">
                <img class="avatar avatar--small" id="avatar-2" src="./resources/assets/avatars/wolf.webp">
            </div>
            <div class="avatar-container avatar-container--small avatar-container--neutral avatar-container" id="avatar-container-3">
                <img class="avatar avatar--small" id="avatar-3" src="./resources/assets/avatars/cat.webp">
            </div> -->
        </div>
        <div>
            <div class="container container--row"><p id="phase-text">Phase _/3</p></div>
        </div>
        <div class="container container--col container--no-padding" id="phase-options-container">
            <div class="textbox textbox--fill-neutral">
                <p class="textbox__text--fill-neutral">Bewege deine Figur zu einem Feld</p>
            </div>
        </div>
    </div>

</body>
</html>

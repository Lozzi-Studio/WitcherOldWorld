<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestProject</title>
    <link rel="stylesheet" type="text/css" href="src/frontend/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://use.typekit.net/xno6vtf.css">

</head>
<body style="margin-top: 0; margin-left: 0;">
    <script type="module" src="./src/main.js"></script>

    <div id="player-container">
        <div id="player-avatar-name">
            <div class="player-avatar"><img id="player-pic" src=""></div>
            <div id="player-box"><p id="player-name">NAME</p></div>
        </div>
        <div id ="player-stats">
            <div class="level-container" id="combat-lvl">
                <div class="stat-icon-container"><img class="stat-icon" src="./resources/assets/stat-icons/combat.png"></div>
            </div>
            <div class="level-container" id="defense-lvl">
                <div class="stat-icon-container"><img class="stat-icon" src="./resources/assets/stat-icons/defense.png"></div>
            </div>
            <div class="level-container" id="alchemy-lvl">
                <div class="stat-icon-container"><img class="stat-icon" src="./resources/assets/stat-icons/alchemy.png"></div>
            </div>
            <div class="level-container" id="special-lvl">
                <div class="stat-icon-container"><img class="stat-icon" src="./resources/assets/stat-icons/speed.png"></div>
            </div>
        </div>
    </div>

    <div id="phase-container">
        <div id="avatars-container">
            <div class="phase-avatar-container-active" id="avatar-1"><img  class="phase-avatar" src="./resources/assets/avatars/bear.webp"></div>
            <div class="phase-avatar-container" id="avatar-2"><img class="phase-avatar" src="./resources/assets/avatars/wolf.webp"></div>
            <div class="phase-avatar-container" id="avatar-3"><img class="phase-avatar" src="./resources/assets/avatars/cat.webp"></div>
        </div>
        <div id="phase-text-container"><p id="phase-text">Phase 1/3</p></div>
        <div id="phase-options-container">
            <div class="phase-options-box">Bewege deine Figur zu einem Feld</div>
        </div>
    </div>

</body>
</html>
